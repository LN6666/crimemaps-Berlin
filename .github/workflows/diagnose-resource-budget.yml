name: Diagnose remaining resource-budget files
on:
  push:
    branches: [codex/ci-resource-budget-first30-20261118]
permissions:
  contents: read
jobs:
  remaining-files:
    # The formal resource-budget job stays required. This representative job
    # retrieves bounded diagnostics before a hung file can consume the job.
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - id: deps
        run: npm --prefix web ci
        timeout-minutes: 3
      - name: Probe official files 031-040
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        timeout-minutes: 4
        run: python3 .github/resource-budget-probe/probe.py --start 30 --count 10 --seconds 30 --out "$RUNNER_TEMP/budget-031-040"
      - name: Preserve files 031-040 including incomplete cases
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: budget-031-040-${{ github.run_id }}
          path: ${{ runner.temp }}/budget-031-040
          retention-days: 3
          if-no-files-found: error
      - name: Probe official files 041-050
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        timeout-minutes: 4
