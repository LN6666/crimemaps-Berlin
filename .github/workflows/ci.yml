name: CrimeMaps checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.23
      - run: uv sync --locked
      - run: uv run pytest -q test_suite/safety test_suite/security tests/migration
  browser:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm --prefix web ci
      - run: npm --prefix web run build
        env:
          CRIMEMAPS_BUILD_PURPOSE: code-check
      - run: npm --prefix web run test:city-data-profile
      - run: npm --prefix web run test:shared-native-source
      - run: npm --prefix web run test:facade-controller-retention
      - run: npm --prefix web run test:owner-city-boundary
      - run: npm --prefix web run test:building-detail-residency
      - run: npm --prefix web run test:material-program-lifecycle
      - run: npm --prefix web run test:navigation
      - run: npm --prefix web run test:statistics
      - run: npm --prefix web run test:painting
      - run: npm --prefix web run test:scene-runtime
      - run: cd web && npx playwright install --with-deps chromium && npm test
